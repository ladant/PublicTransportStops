<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Co pojede?</title>
    <meta name="description" content="Co pojede? Zastávky autobusů a vlaků v okolí a odjezdy na výlet i zpět ve zvolený den a čas." />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1b1a" media="(prefers-color-scheme: dark)" />
    <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <h1><img src="icons/icon.svg" alt="" width="24" height="24" /> <span data-i18n="title"></span></h1>
        <div class="actions">
          <button id="theme" class="ghost" type="button"></button>
          <button id="lang" class="ghost" type="button"></button>
        </div>
      </header>

      <main class="layout">
        <form id="controls" class="controls" onsubmit="return false">
          <div class="row">
            <input type="date" id="date" class="date" required aria-label="Den" />
            <div class="modes" role="group" aria-label="Doprava">
              <label class="chip"><input type="checkbox" name="mode" value="bus" checked /><span data-i18n="bus"></span></label>
              <label class="chip"><input type="checkbox" name="mode" value="rail" checked /><span data-i18n="rail"></span></label>
              <label class="chip" id="tramChip"><input type="checkbox" name="mode" value="tram" checked /><span data-i18n="tram"></span></label>
            </div>
          </div>
          <div class="wins">
            <div class="win a" id="winA">
              <label class="wtitle"><input type="checkbox" id="useA" checked aria-label="1. čas" /><i class="dot a"></i></label>
              <button type="button" class="kind" id="kindA" data-w="a"></button>
              <div class="times">
                <input type="time" id="a1" value="08:00" step="300" aria-label="1. čas od" />
                <span>–</span>
                <input type="time" id="a2" value="11:00" step="300" aria-label="1. čas do" />
              </div>
            </div>
            <div class="win b off" id="winB">
              <label class="wtitle"><input type="checkbox" id="useB" aria-label="2. čas" /><i class="dot b"></i></label>
              <button type="button" class="kind" id="kindB" data-w="b"></button>
              <div class="times">
                <input type="time" id="b1" value="15:00" step="300" aria-label="2. čas od" />
                <span>–</span>
                <input type="time" id="b2" value="19:00" step="300" aria-label="2. čas do" />
              </div>
            </div>
          </div>
          <button type="button" id="ctlToggle" class="ctl-toggle" aria-expanded="true" aria-controls="controls">
            <span id="ctlSummary" class="summary"></span>
            <span id="ctlAction" class="act"></span>
          </button>
        </form>

        <section class="mapwrap" id="mapwrap">
          <div id="map" aria-label="Mapa"></div>
          <button id="locate" class="fab" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <button id="reset" class="fab fab-reset" type="button" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
          <div id="legend" class="legend"></div>
        </section>

        <section class="below" id="below">
          <div class="area-row">
            <div class="seg" role="group" aria-label="Oblast">
              <button type="button" data-area="c" data-i18n="areaCircle"></button>
              <button type="button" data-area="v" data-i18n="areaView"></button>
            </div>
            <label class="radius" id="radiusRow">
              <output id="rOut"></output>
              <input type="range" id="radius" min="0.5" max="15" step="0.5" value="3" aria-label="Okruh" />
            </label>
          </div>

          <div id="notice" class="notice" hidden></div>
          <p id="status" class="status" aria-live="polite"></p>

          <section id="stop" class="card stopcard" hidden aria-live="polite"></section>

          <section id="lines" class="lines" hidden>
            <h2 data-i18n="lines"></h2>
            <p class="hint" data-i18n="linesHint"></p>
            <ul id="lineList"></ul>
          </section>

          <footer class="foot" id="foot"></footer>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
