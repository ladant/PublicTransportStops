<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bus na výlet</title>
    <meta name="description" content="Kam se dá dojet veřejnou dopravou: zastávky v okolí, odkud ve zvolený den a čas něco jede." />
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1b1a" media="(prefers-color-scheme: dark)" />
    <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <h1><img src="icons/icon.svg" alt="" width="24" height="24" /> <span data-i18n="title"></span></h1>
        <div class="actions">
          <button id="theme" class="ghost" type="button"></button>
          <button id="lang" class="ghost" type="button"></button>
        </div>
      </header>

      <main class="layout">
        <section class="mapwrap">
          <div id="map" aria-label="Mapa"></div>
          <button id="locate" class="fab" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span data-i18n="myLocation"></span>
          </button>
          <div id="legend" class="legend"></div>
        </section>

        <aside class="panel">
          <form id="controls" class="controls" onsubmit="return false">
            <label class="field">
              <span data-i18n="date"></span>
              <input type="date" id="date" required />
            </label>
            <div class="field wide">
              <span data-i18n="winA"></span>
              <div class="win">
                <input type="time" id="a1" value="08:00" step="300" aria-label="A od" />
                <span>–</span>
                <input type="time" id="a2" value="11:00" step="300" aria-label="A do" />
              </div>
            </div>
            <div class="field wide">
              <label class="check"><input type="checkbox" id="useB" /> <span data-i18n="winB"></span></label>
              <div class="win" id="winB">
                <input type="time" id="b1" value="15:00" step="300" aria-label="B od" />
                <span>–</span>
                <input type="time" id="b2" value="19:00" step="300" aria-label="B do" />
              </div>
            </div>
            <label class="field">
              <span><span data-i18n="radius"></span>: <output id="rOut"></output></span>
              <input type="range" id="radius" min="0.5" max="15" step="0.5" value="3" />
            </label>
            <fieldset class="field modes">
              <legend data-i18n="modes"></legend>
              <label class="chip"><input type="checkbox" name="mode" value="bus" checked /> <span data-i18n="bus"></span></label>
              <label class="chip"><input type="checkbox" name="mode" value="rail" checked /> <span data-i18n="rail"></span></label>
              <label class="chip"><input type="checkbox" name="mode" value="tram" checked /> <span data-i18n="tram"></span></label>
            </fieldset>
          </form>

          <div id="notice" class="notice" hidden></div>
          <p id="status" class="status" aria-live="polite"></p>

          <section id="lines" class="lines" hidden>
            <h2 data-i18n="lines"></h2>
            <p class="hint" data-i18n="linesHint"></p>
            <ul id="lineList"></ul>
          </section>

          <footer class="foot" id="foot"></footer>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
